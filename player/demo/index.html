    "place_days_range": "{from} a {until}",
    "place_days_pair": "{from} y {until}",
    "place_time_range": "{from} – {until}"

}
</script>
<script>
  // ?at=now: the real clock, for a device that runs the demo for hours.
  (function () {
    if (/[?&]at=now\b/.test(location.search)) {
      var n = document.getElementById('hechauka-boot');
      var b = JSON.parse(n.textContent);
      delete b.at;
      n.textContent = JSON.stringify(b);
    }
  }());
</script>
<script src="../tiempo-iconos.js"></script>
<script src="../actividad-iconos.js"></script>
<script src="../build/hechauka.js"></script>
</body>
</html>
